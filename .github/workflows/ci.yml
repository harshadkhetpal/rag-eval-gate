name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Gate demo must pass on the healthy system
        env:
          PYTHONPATH: examples
        run: |
          rageval gate --golden examples/golden.jsonl --system toy_rag:answer --baseline /tmp/b.json
          rageval gate --golden examples/golden.jsonl --system toy_rag:answer --baseline /tmp/b.json
      - name: Gate demo must FAIL on the broken system
        # The whole point of the tool. If the broken deploy passes the gate, CI fails.
        env:
          PYTHONPATH: examples
        run: |
          if rageval gate --golden examples/golden.jsonl --system toy_rag:broken_answer --baseline /tmp/b.json; then
            echo "gate should have failed on the regression" && exit 1
          fi
